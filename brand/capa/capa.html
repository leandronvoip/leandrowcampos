<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — IA no Negócio (laranja)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--or1:#F26A1B;--or2:#FF8D3C;--ink:#0A0A0C;--ink2:rgba(10,10,12,.72);--cream:#F5F3EE}
  html,body{margin:0;background:var(--ink)}
  .capa{position:relative;width:1480px;height:2100px;overflow:hidden;color:var(--ink);font-family:Inter,system-ui,sans-serif;
    background:linear-gradient(160deg,var(--or2) 0%,var(--or1) 55%,#D9570F 100%)}
  .glow{position:absolute;inset:0;background:radial-gradient(900px 800px at 85% 10%, rgba(255,255,255,.22), transparent 60%)}
  .grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  .net{position:absolute;right:-40px;top:120px;width:980px;height:980px;opacity:.28}
  .eyebrow{position:absolute;left:140px;top:150px;display:flex;align-items:center;gap:18px;font:600 26px/1 Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
  .eyebrow svg{width:30px;height:30px}
  .serie{position:absolute;left:140px;top:204px;font:500 24px/1 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .title{position:absolute;left:140px;right:120px;top:600px;font:600 196px/.95 'Inter Tight';letter-spacing:-.045em;color:var(--ink)}
  .title .dot{color:var(--cream)}
  .sub{position:absolute;left:140px;right:140px;top:1050px;font:500 64px/1.15 'Inter Tight';letter-spacing:-.02em;color:var(--ink)}
  .desc{position:absolute;left:140px;right:300px;top:1250px;font:400 34px/1.5 Inter;color:var(--ink2)}
  .rule{position:absolute;left:140px;top:1700px;width:120px;height:3px;background:var(--ink)}
  .author{position:absolute;left:140px;top:1750px;font:600 56px/1 'Inter Tight';letter-spacing:-.035em;color:var(--ink)}
  .author .dot{color:var(--cream)}
  .role{position:absolute;left:140px;top:1828px;font:400 28px/1.4 Inter;color:var(--ink2)}
  .lc{position:absolute;right:140px;bottom:140px;width:120px;height:120px}
  .lc text{font-family:'Inter Tight';font-weight:600;font-size:26px;letter-spacing:-1px}
</style>
</head>
<body>
<div class="capa">
  <div class="glow"></div><div class="grain"></div>
  <!-- Elemento de IA: malha de nós conectados (abstrata, sem rosto, sem robô) -->
  <svg class="net" viewBox="0 0 400 400" fill="none" stroke="#0A0A0C" stroke-width="1.2">
    <g id="links">
      <path d="M60 80 L160 40 L260 70 L340 30"/><path d="M60 80 L120 170 L160 40"/><path d="M120 170 L260 70 L300 170 L340 30"/>
      <path d="M120 170 L80 280 L190 250 L300 170"/><path d="M190 250 L260 340 L360 300 L300 170"/><path d="M80 280 L150 370 L260 340"/>
      <path d="M190 250 L230 150 L260 70"/><path d="M230 150 L300 170"/><path d="M150 370 L190 250"/>
    </g>
    <g fill="#0A0A0C" stroke="none">
      <circle cx="60" cy="80" r="7"/><circle cx="160" cy="40" r="5"/><circle cx="260" cy="70" r="9"/><circle cx="340" cy="30" r="5"/>
      <circle cx="120" cy="170" r="8"/><circle cx="300" cy="170" r="11"/><circle cx="230" cy="150" r="5"/><circle cx="80" cy="280" r="6"/>
      <circle cx="190" cy="250" r="10"/><circle cx="260" cy="340" r="6"/><circle cx="360" cy="300" r="7"/><circle cx="150" cy="370" r="5"/>
    </g>
    <g fill="none" stroke="#0A0A0C" stroke-width="1.2" opacity=".6"><circle cx="300" cy="170" r="22"/><circle cx="190" cy="250" r="20"/><circle cx="260" cy="70" r="18"/></g>
  </svg>
  <div class="eyebrow">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
    Primeiro e-book
  </div>
  <div class="serie">Crescer sem contratar</div>
  <div class="title">IA no<br>Negócio<span class="dot">.</span></div>
  <div class="sub">O manual prático<br>do empreendedor</div>
  <div class="desc">Os prompts e agentes que uso para operar minha empresa, prontos para a sua. Dez áreas, seis agentes para começar, zero código.</div>
  <div class="rule"></div>
  <div class="author">Leandro Campos<span class="dot">.</span></div>
  <div class="role">Fundador da Nvoip · 15 anos empreendendo</div>
  <svg class="lc" viewBox="0 0 64 64" fill="none" stroke="#0A0A0C"><rect x="2" y="2" width="60" height="60" rx="14" stroke-width="2.5"/><text x="32" y="41" text-anchor="middle" fill="#0A0A0C" stroke="none">LC</text></svg>
</div>
</body>
</html>
