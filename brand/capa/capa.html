<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa — IA no Negócio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0A0C;--ink:#F5F3EE;--muted:#A3A09A;--gold:#D4A857;--line:rgba(255,255,255,.14)}
  html,body{margin:0;background:var(--bg)}
  /* A5 vertical em 1480×2100 (proporção 1:1,42) */
  .capa{position:relative;width:1480px;height:2100px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .glow{position:absolute;inset:0;background:
      radial-gradient(900px 700px at 78% 18%, rgba(212,168,87,.16), transparent 60%),
      radial-gradient(1100px 900px at 20% 95%, rgba(255,255,255,.06), transparent 60%)}
  .grain{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  .frame{position:absolute;inset:72px;border:1.5px solid var(--line);border-radius:28px}
  .eyebrow{position:absolute;left:140px;top:150px;font:500 26px/1 Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .serie{position:absolute;left:140px;top:200px;font:400 24px/1 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .title{position:absolute;left:140px;right:140px;top:560px;font:600 196px/.95 'Inter Tight';letter-spacing:-.045em}
  .title .dot{color:var(--gold)}
  .sub{position:absolute;left:140px;right:140px;top:1010px;font:500 64px/1.15 'Inter Tight';letter-spacing:-.02em;color:var(--ink)}
  .desc{position:absolute;left:140px;right:260px;top:1210px;font:400 34px/1.5 Inter;color:var(--muted)}
  .rule{position:absolute;left:140px;top:1690px;width:120px;height:3px;background:var(--gold)}
  .author{position:absolute;left:140px;top:1740px;font:600 56px/1 'Inter Tight';letter-spacing:-.03em}
  .author .dot{color:var(--gold)}
  .role{position:absolute;left:140px;top:1818px;font:400 28px/1.4 Inter;color:var(--muted)}
  .lc{position:absolute;right:140px;bottom:140px;width:112px;height:112px}
  .lc text{font-family:'Inter Tight';font-weight:600;font-size:26px;letter-spacing:-1px}
</style>
</head>
<body>
<div class="capa">
  <div class="glow"></div><div class="grain"></div><div class="frame"></div>
  <div class="eyebrow">Primeira série</div>
  <div class="serie">Crescer sem contratar</div>
  <div class="title">IA no<br>Negócio<span class="dot">.</span></div>
  <div class="sub">O manual prático<br>do empreendedor</div>
  <div class="desc">Os prompts e agentes que uso para operar minha empresa, prontos para a sua. Dez áreas, seis agentes para começar, zero código.</div>
  <div class="rule"></div>
  <div class="author">Leandro Campos<span class="dot">.</span></div>
  <div class="role">Fundador da Nvoip · 15 anos empreendendo</div>
  <svg class="lc" viewBox="0 0 64 64" fill="none" stroke="#F5F3EE"><rect x="2" y="2" width="60" height="60" rx="14" stroke-width="2.5" opacity=".7"/><text x="32" y="41" text-anchor="middle" fill="#F5F3EE" stroke="none">LC</text></svg>
</div>
</body>
</html>
