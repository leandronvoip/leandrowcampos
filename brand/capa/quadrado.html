<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem do produto 1200×1200 — IA no Negócio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0A0C;--ink:#F5F3EE;--muted:#A3A09A;--gold:#D4A857;--line:rgba(255,255,255,.14)}
  html,body{margin:0;background:var(--bg)}
  .q{position:relative;width:1200px;height:1200px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .glow{position:absolute;inset:0;background:radial-gradient(800px 600px at 80% 15%, rgba(212,168,87,.16), transparent 60%)}
  .frame{position:absolute;inset:56px;border:1.5px solid var(--line);border-radius:24px}
  .eyebrow{position:absolute;left:110px;top:120px;font:500 22px/1 Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .title{position:absolute;left:110px;right:110px;top:330px;font:600 164px/.95 'Inter Tight';letter-spacing:-.045em}
  .title .dot{color:var(--gold)}
  .sub{position:absolute;left:110px;right:110px;top:690px;font:500 48px/1.15 'Inter Tight';letter-spacing:-.02em}
  .rule{position:absolute;left:110px;top:900px;width:100px;height:3px;background:var(--gold)}
  .author{position:absolute;left:110px;top:940px;font:600 44px/1 'Inter Tight';letter-spacing:-.03em}
  .author .dot{color:var(--gold)}
  .role{position:absolute;left:110px;top:1000px;font:400 24px/1.4 Inter;color:var(--muted)}
</style>
</head>
<body>
<div class="q">
  <div class="glow"></div><div class="frame"></div>
  <div class="eyebrow">Primeira série · E-book</div>
  <div class="title">IA no<br>Negócio<span class="dot">.</span></div>
  <div class="sub">O manual prático do empreendedor</div>
  <div class="rule"></div>
  <div class="author">Leandro Campos<span class="dot">.</span></div>
  <div class="role">Fundador da Nvoip · 15 anos empreendendo</div>
</div>
</body>
</html>
